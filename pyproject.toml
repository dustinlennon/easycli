[project]
name = "easycli"
version = "0.2.0"
description = ""
authors = [
    {name = "Dustin Lennon",email = "dustin.lennon@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"

# Use scripts/versioning.py to pull dependencies from pipenv

dependencies = [
  'pydantic (==2.13.5)', 
  'pyyaml (==6.0.3)'
]

[dependency-groups]
dev = [
  'pytest (==9.1.1)', 
  'fastapi (==0.142.2)', 
  'uvicorn (==0.54.0)', 
  'erdantic (==1.2.1)'
]

[tool.poetry]
packages = [
    {include = "easycli", from = "src"}
]

include = [
    { path = "tests", format = "sdist" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

